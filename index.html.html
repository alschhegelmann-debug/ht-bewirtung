<div>
<h1>HT Bewirtungsbeleg</h1>
<div style="font-size:12px;color:#aaa;">Mobile Erfassung</div>
</div>
</div>

<div class="section">
<label>Datum</label>
<input type="date" id="datum">

<label>Ort / Betrieb</label>
<input type="text" id="ort">

<label>Wer lädt ein?</label>
<input type="text" id="einlader">

<label>Teilnehmer / Gäste</label>
<textarea id="gaeste"></textarea>

<label>Anlass</label>
<select id="anlass">
<option>Geschäftsanbahnung</option>
<option>Kundenpflege</option>
<option>Geschäftsreise</option>
<option>Sonstiges</option>
</select>

<label>Betrag</label>
<input type="number" id="betrag">

<button onclick="save()">Speichern</button>
<button onclick="send()">📤 Versenden</button>

</div>

</div>

<script>
function save(){
  alert("Gespeichert (Demo)");
}

function send(){
  const text = `
HT Bewirtungsbeleg
Datum: ${
    document.getElementById('datum').value
}
Ort: ${
    document.getElementById('ort').value
}
Einlader: ${
    document.getElementById('einlader').value
}
Gäste: ${
    document.getElementById('gaeste').value
}
Betrag: ${
    document.getElementById('betrag').value
} €`;

  if(navigator.share){
    navigator.share({text});
  } else {
    navigator.clipboard.writeText(text);
    alert("Kopiert");
  }
}
</script>

</body>
</html>
